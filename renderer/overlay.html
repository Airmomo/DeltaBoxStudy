// DOM 事件（未启用 forward 转发，见 main.js），由主进程屏幕光标坐标
// （cursor:move，~60Hz 节流）驱动同一套命中测试。
function trackPointer(clientX, clientY) {
  pointerPosition = { clientX, clientY };

}
function updateInteraction() {
  pointerFrame = null;
  const e = pointerPosition;
  if (!e) return;
  const rect = interactiveRectAt(e.clientX, e.clientY);
  setInteract(!!rect, rect);
}
function interactiveRectAt(clientX, clientY) {
  const e = { clientX, clientY };
  // 轮询光标可能位于副屏或游戏客户区外，不能把负 x 当成侧栏悬停。
  if (![e.clientX, e.clientY].every(Number.isFinite) || e.clientX < 0 || e.clientY < 0 ||
      e.clientX >= innerWidth || e.clientY >= innerHeight) {
    return null;
  }
  // 级联命中：第一个命中的区域给出交互矩形（CSS px），推给宿主端定位输入窗口
  let rect = null;
  const wrap = $('#sidebar');
  if (wrap) {
    const r = wrap.getBoundingClientRect();   // 单次布局读取：展开=整个侧栏+外沿把手(28px)，折叠=只剩把手区域
    if (state.sidebarCollapsed) {
      // 命中区取把手自身 rect（含边距与原硬编码带一致），跟随几何覆盖与 ui-zoom；
      // 原固定带 y60~150 在 1080p（zoom=0.75）下够不到把手顶部
      const hb = wrap.querySelector('#collapse-handle')?.getBoundingClientRect();
      if (hb && e.clientX >= hb.left - 2 && e.clientX <= hb.right + 2 && e.clientY >= hb.top - 2 && e.clientY <= hb.bottom + 10)
        rect = { x: hb.left - 4, y: hb.top - 2, w: hb.width + 8, h: hb.height + 14 };
    } else if (e.clientX <= r.right + 30) {

  if (!rect) {
    const sb = $('#switch-btn');   // 地图页头部行；记牌器页无此元素
    if (sb) {
      const r = sb.getBoundingClientRect();
      if (e.clientX >= r.left - 4 && e.clientX <= r.right + 4 && e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4)

  }
  if (!rect && $('#map-menu').classList.contains('open')) {
    const mr = $('#map-menu').getBoundingClientRect();
    if (e.clientX >= mr.left - 4 && e.clientX <= mr.right + 4 && e.clientY >= mr.top - 4 && e.clientY <= mr.bottom + 4)
      rect = { x: mr.left - 6, y: mr.top - 6, w: mr.width + 12, h: mr.height + 12 };
  }
  if (!rect && $('#am-confirm').classList.contains('open')) {
    const ar = $('#am-confirm').getBoundingClientRect();
    if (e.clientX >= ar.left - 4 && e.clientX <= ar.right + 4 && e.clientY >= ar.top - 4 && e.clientY <= ar.bottom + 4)
      rect = { x: ar.left - 6, y: ar.top - 6, w: ar.width + 12, h: ar.height + 12 };
  }
  if (!rect && $('#cap-confirm').classList.contains('open')) {
    const cr = $('#cap-confirm').getBoundingClientRect();
    if (e.clientX >= cr.left - 4 && e.clientX <= cr.right + 4 && e.clientY >= cr.top - 4 && e.clientY <= cr.bottom + 4)
      rect = { x: cr.left - 6, y: cr.top - 6, w: cr.width + 12, h: cr.height + 12 };
  }
  if (!rect && $('#ns-confirm').classList.contains('open')) {
    const nr = $('#ns-confirm').getBoundingClientRect();
    if (e.clientX >= nr.left - 4 && e.clientX <= nr.right + 4 && e.clientY >= nr.top - 4 && e.clientY <= nr.bottom + 4)
      rect = { x: nr.left - 6, y: nr.top - 6, w: nr.width + 12, h: nr.height + 12 };
  }
  if (!rect && popoverEl) {
    const pr = popoverEl.getBoundingClientRect();
    if (e.clientX >= pr.left - 4 && e.clientX <= pr.right + 4 && e.clientY >= pr.top - 4 && e.clientY <= pr.bottom + 4)
      rect = { x: pr.left - 6, y: pr.top - 6, w: pr.width + 12, h: pr.height + 12 };
  }

}
// 单击原样落到下方游戏，宿主只旁观完整点击。双击需同时满足系统时间/距离、
// 同一可见物资点、同一定位代次，且两次按下/抬起均不在侧栏或详情卡上。
let pendingMarkerClick = null;
function markerAt(x, y) {
  if (![x, y].every(Number.isFinite) || x < 0 || y < 0 || x >= innerWidth || y >= innerHeight) return null;

  for (let i = hitPoints.length - 1; i >= 0; i--) {
    const hp = hitPoints[i];

    if (Math.hypot(hp.x * s + view.tx - x, hp.y * s + view.ty - y) <= rr) return hp;

function acceptMarkerClick(event) {

  if (!event?.eligible || !tracking.valid || now - tracking.capturedAt > 750 ||

  if (event.doubleClick && previous?.p === hp.p && previous.catId === hp.catId &&
      previous.epoch === tracking.epoch && previous.map === state.map && previous.sequence + 1 === event.sequence) {
    showPopover(hp.x * sView() + view.tx, hp.y * sView() + view.ty, hp.p, hp.catId);
    reportTracking('INFO', 'marker-detail', '双击打开物资点详情', { catId: hp.catId, x: hp.x, y: hp.y });
    trackPointer(event.x, event.y);
    return true;
  }
  pendingMarkerClick = { p: hp.p, catId: hp.catId, sequence: event.sequence, epoch: tracking.epoch, map: state.map };
  return false;
}
window.addEventListener('mousemove', (e) => trackPointer(e.clientX, e.clientY), { passive: true });
window.addEventListener('blur', () => {
  pendingMarkerClick = null;
  window.overlay?.cancelPointer?.();
  if (pointerFrame !== null) cancelAnimationFrame(pointerFrame);
  pointerFrame = null;
  pointerPosition = null;
  setInteract(false);
});

/* ---------- 启动 ---------- */
window.addEventListener('resize', () => { applyUiZoom(); resetTracking(); renderMap(); });
// 调试辅助：?cats=bxx,dyx 预先激活类别
const urlCats = new URLSearchParams(location.search).get('cats');
if (urlCats) urlCats.split(',').forEach(c => state.activeCats.add(c.trim()));
applyUiZoom();
startSbClock();
buildMenu();
buildSidebar();
renderMap();
resetTracking();
applyNoSignalMapVisibility();
// 启动即回放持久化的「直播/录屏模式」，与主进程在显示窗口前恢复的保存值保持一致。
window.overlay?.setDesktopCapture?.(state.desktopCapture);
window.overlay?.setCaptureHidden?.(state.streamHide);

/* ---------- 视觉结果与界面光标事件 ---------- */
if (window.overlay?.onView) {
  window.overlay.onView('tracking:result', acceptTracking);
  window.overlay.onView('tracking:reset', resetTracking);
  window.overlay.onView('tracking:map-key', hideMapForKey);
  window.overlay.onView('cursor:move', (p) => trackPointer(p.x, p.y));
  window.overlay.onView('marker:click', acceptMarkerClick);
  window.overlay.onView('about:update', applyAboutUpdate);
  // 关于页初始内容直接读内置默认（data/about.json = about/ 内容仓的内置副本），
  // 主进程 about:update（上次快照/远端最新）随后覆盖；网络获取失败也有完整内容
  fetch('data/about.json')
    .then(r => (r.ok ? r.json() : null))
    .then(d => { if (d && typeof d === 'object' && !aboutRemote) applyAboutUpdate(d); })
    .catch(() => {});
  window.overlay.onView('version:update', applyVersionUpdate);
  window.overlay.onView('sidebar:toggle', toggleSidebar);
}
reportTracking('INFO', 'display', '叠加层显示参数',
  { width: innerWidth, height: innerHeight, dpr: devicePixelRatio });
if (typeof PerformanceObserver !== 'undefined' && PerformanceObserver.supportedEntryTypes?.includes('longtask')) {
  new PerformanceObserver(list => {
    const entries = list.getEntries();
    const maxMs = Math.max(...entries.map(e => e.duration));
    reportTracking('WARN', 'long-task', '前端主线程长任务',
      { maxMs, count: entries.length, selectedCategories: state.activeCats.size, markers: hitPoints.length });
  }).observe({ type: 'longtask', buffered: false });
}
let uiHeartbeatAt = performance.now();
let uiAnimationPending = false;
setInterval(() => {
  const now = performance.now(), gapMs = now - uiHeartbeatAt;
  uiHeartbeatAt = now;
  if (gapMs > 1500) reportTracking('WARN', 'ui-gap', '前端定时回调延迟', { gapMs });
  // Keep just one outstanding callback. Separate animation scheduling delays
  // from JS timer delays when a foreground game stresses the graphics pipeline.
  if (!uiAnimationPending) {
    uiAnimationPending = true;
    const requestedAt = now;
    requestAnimationFrame(() => {
      uiAnimationPending = false;
      const completedAt = performance.now(), waitMs = completedAt - requestedAt;
      if (waitMs > 250) reportTracking('WARN', 'animation-gap', '前端动画回调延迟',
        { waitMs, timerAgeMs: completedAt - uiHeartbeatAt,
          visibility: document.visibilityState, focused: document.hasFocus() });
    });
  }
}, 1000);
// A stalled capture/worker must not leave apparently accurate markers on screen.
setInterval(() => {
  if (tracking.valid && Date.now() - tracking.capturedAt > 750) {
    reportTracking('WARN', 'expired', '定位更新中断，自动隐藏点位',
      { ageMs: Date.now() - tracking.capturedAt, lastSource: tracking.last?.source, lastMatchMs: tracking.last?.ms });
    loseTracking('画面更新延迟 · 正在重新定位');
  }
}, 100);
window.__viewDebug = () => ({ ...view, valid: tracking.valid, last: tracking.last });

if (new URLSearchParams(location.search).has('dumpstate')) {
  document.title = 'DBG:' + JSON.stringify({
    map: state.map, mode: state.mode, events: state.events,
    activeCats: [...state.activeCats], checkedClasses: [...state.checkedClasses],
    labelsOn: state.labelsOn, w: innerWidth, h: innerHeight,
    markers: document.querySelectorAll('.marker').length,
    paths: document.querySelectorAll('#world-svg path').length,
    view: window.__viewDebug(),
  });
}
</script>
</body>
</html>
